<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1140">
<title>Master Kingdom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Press Start 2P';src:url('PressStart2P-Regular.ttf') format('truetype');font-display:swap}
:root{--bg:#1b1140;--panel:#2d1b69;--edge:#ffd23f;--ink:#fff;--teal:#2ec4b6;--blue:#2f6fed;--ok:#1fa971;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P','Courier New',monospace;font-size:12px;line-height:1.6}
canvas{image-rendering:pixelated}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 15%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#ffd23f,transparent),radial-gradient(2px 2px at 40% 80%,#fff,transparent)}
h1{font-size:22px;color:var(--edge);text-shadow:3px 3px #7b4dff;margin:8px 0 0}
h2{font-size:14px;color:var(--edge);margin:4px 0}
.sub{color:var(--teal);font-size:11px}
.btn{font:inherit;color:#fff;background:var(--blue);border:4px solid var(--edge);box-shadow:0 5px #0a1f5c;padding:16px 14px;min-height:56px;width:100%;max-width:340px;cursor:pointer;font-size:12px}
.btn:active{transform:translateY(4px);box-shadow:0 1px #0a1f5c}
.btn.alt{background:var(--panel)}.btn.sm{width:auto;min-height:44px;padding:10px 12px}
.box{background:var(--panel);border:4px solid var(--edge);padding:14px;width:100%}
.grid{display:grid;gap:12px;width:100%;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{font:inherit;min-height:96px;border:4px solid #fff;background:#3b2a85;font-size:34px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.opt.hint{animation:pulse .6s infinite alternate;border-color:var(--edge)}
.opt.good{background:var(--ok)}
.opt.bad{animation:shake .3s}
.sw{width:56px;height:56px;border:3px solid #fff}
.big{font-size:56px;min-height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}
.dots span{display:inline-block;width:14px;height:14px;background:#4a3a8a;margin:0 3px}.dots .on{background:var(--edge)}
.world{font:inherit;color:#fff;border:4px solid #fff;padding:12px;width:100%;max-width:340px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.lock{opacity:.55;filter:grayscale(.7)}
.float{animation:fl 2s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px)}}@keyframes pulse{to{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input{font:inherit;padding:12px;width:100%;max-width:260px;border:4px solid var(--edge);background:#fff;color:#000;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.sel{outline:4px solid var(--edge)}
.btn:hover,.btn:focus-visible{filter:brightness(1.15);box-shadow:0 5px #0a1f5c,0 0 16px var(--edge)}
.sk{position:fixed;width:6px;height:6px;background:var(--edge);pointer-events:none;z-index:99;animation:sk .6s forwards}
@keyframes sk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#app::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 60% 40%,#fff,transparent),radial-gradient(2px 2px at 90% 10%,#ffd23f,transparent),radial-gradient(1px 1px at 30% 75%,#7fd6f0,transparent);animation:drift 12s linear infinite alternate}
@keyframes drift{from{transform:translateY(-20px)}to{transform:translateY(20px)}}
@media (prefers-reduced-motion:reduce){*,#app::before{animation:none!important}}
</style>
</head><body><div id="app"></div>
<noscript>Master Kingdom needs JavaScript to run.</noscript>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const PAL={Y:'#ffd23f',S:'#ffd9b3',E:'#222',W:'#fff',B:'#f0f0f0',G:'#8d99ae',T:'#2ec4b6',D:'#3a2a5a',P:'#ff6b9d'};
const WIZ=["....HH....","...HHHH...","..HHYHHH..",".HHHHHHHH.","HHHHHHHHHH","..SSSSSS..","..SESSES..","..SSSSSS..",".RRRRRRRR.","RRRRRRRRRR","RRRRRRRRRR","..RR..RR.."];
const PROF=["....WW....","...WWWW...","..WWYWWW..",".WWWWWWWW.","WWWWWWWWWW","..SSSSSS..","..SESSES..","..BBBBBB..",".BBBBBBBB.","PPPPPPPPPP","PPPPPPPPPP","..PP..PP.."];
const CASTLE=["T..T..TT..T..T","TT.TT.TT.TT.TT","GG.GG.GG.GG.GG","GGGGGGGGGGGGGG","GGYGGGDDGGGYGG","GGGGGGDDGGGGGG","GGGGGGDDGGGGGG","GGGGGGDDGGGGGG"];
function spr(rows,over,sc){const c=document.createElement('canvas');c.width=rows[0].length*sc;c.height=rows.length*sc;const x=c.getContext('2d'),p={...PAL,...over};
rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(p[ch]){x.fillStyle=p[ch];x.fillRect(i*sc,j*sc,sc,sc)}}));return c.outerHTML.replace('<canvas','<canvas class="float"')}
function sprHTML(rows,over,sc){const c=document.createElement('canvas');c.width=rows[0].length*sc;c.height=rows.length*sc;const x=c.getContext('2d'),p={...PAL,...over};
rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(p[ch]){x.fillStyle=p[ch];x.fillRect(i*sc,j*sc,sc,sc)}}));return c}
function art(rows,over,sc,cls){const w=document.createElement('span');const c=sprHTML(rows,over,sc);if(cls)c.className=cls;w.appendChild(c);return w}
const HATS=[['#7b4dff','#2ec4b6'],['#2f6fed','#ff6b9d'],['#1fa971','#ffd23f'],['#e8505b','#7b4dff'],['#ffd23f','#7b4dff'],['#0f4d2e','#9dff7a'],['#12407a','#7fd6f0'],['#1a1a4a','#2f6fed'],['#ff6b9d','#8a2be2'],['#e63946','#ffd23f']];
const HNEED=[null,null,null,null,'colour','maze','lakemaze','mseq','jigsaw','final'];
const LV=[['Little Wizards','2-3'],['Young Wizards','4-6'],['Master Wizards','7-9']];
const KEY='mk_save_v1';
let S=load();
function def(){return{name:'',hat:0,lvl:1,done:{},stars:0,crystal:false,mute:false,seenIntro:false,items:[],fc:false,fi:false,vc:false,vi:false,lc:false,li:false,mc:false,mi:false,rc:false,ri:false,op:false,nar:true,mv:60,sv:80,nv:100,coins:0,deco:[],pet:''}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(!j||typeof j!=='object')return def();const d=def();
d.name=typeof j.name==='string'?j.name.slice(0,12):'';d.hat=Number.isInteger(j.hat)&&j.hat>=0&&j.hat<HATS.length?j.hat:0;d.lvl=[0,1,2].includes(j.lvl)?j.lvl:1;
d.done=j.done&&typeof j.done==='object'?j.done:{};d.stars=Number.isInteger(j.stars)?j.stars:0;d.crystal=!!j.crystal;d.mute=!!j.mute;d.seenIntro=!!j.seenIntro;d.items=Array.isArray(j.items)?j.items.filter(x=>typeof x==='string').slice(0,50):[];d.fc=!!j.fc;d.fi=!!j.fi;d.vc=!!j.vc;d.vi=!!j.vi;d.lc=!!j.lc;d.li=!!j.li;d.mc=!!j.mc;d.mi=!!j.mi;d.rc=!!j.rc;d.ri=!!j.ri;d.op=!!j.op;d.nar=j.nar!==false;['mv','sv','nv'].forEach((k,i)=>{d[k]=Number.isFinite(j[k])?Math.max(0,Math.min(100,j[k])):[60,80,100][i]});d.coins=Number.isInteger(j.coins)&&j.coins>=0?j.coins:0;d.deco=Array.isArray(j.deco)?j.deco.filter(x=>typeof x=='string').slice(0,20):[];d.pet=typeof j.pet=='string'?j.pet.slice(0,12):'';return d}catch(e){return def()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(KEY)}catch(e){return false}}
let AC;function beep(notes){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.12;o.start(t);o.stop(t+.1)})}catch(e){}}
const GOOD=()=>beep([523,659,784]),BAD=()=>beep([220]),TAP=()=>beep([440]);
const wiz=(sc)=>{const w=art(WIZ,{H:HATS[S.hat][0],R:HATS[S.hat][1]},sc,'float');return w.outerHTML};
const html=(h)=>{themeFor(h);PAL.H=HATS[S.hat][0];PAL.R=HATS[S.hat][1];app.innerHTML=h.replace(EMR,(m,e)=>pic(EM[e],e=='🧙'?2:3));window.scrollTo(0,0)};
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function holder(id,el){const h=$('#'+id);if(h)h.appendChild(el)}

function menu(){html(`<h1>MASTER<br>KINGDOM</h1><div class="sub">A MAGICAL JOURNEY AWAITS!</div><div class='row' style='align-items:end'>${pic('isle',5,'float')}<div id="cs"></div>${pic('tree',5,'float')}${pic('wave',5,'float')}</div>
<button class="btn" onclick="TAP();S.name||S.seenIntro?map():choose(true)">PLAY</button>
${hasSave()&&S.seenIntro?'<button class="btn alt" onclick="TAP();map()">CONTINUE ADVENTURE</button>':''}
<button class="btn alt" onclick="TAP();choose(false)">CHOOSE YOUR CHARACTER</button>
<button class="btn alt" onclick="TAP();settings()">SETTINGS</button>
<button class="btn alt" onclick="TAP();parent()">PARENT AREA</button><div class="sub">The greatest magic is within you!</div>`);
holder('cs',art(CASTLE,{},12,'float'));startMusic()}

function choose(first){html(`<h2>Choose your wizard</h2><div id="pv"></div>
<div class="row">${HATS.map((h,i)=>`<button class="btn sm ${i==S.hat?'sel':''}" style="background:${h[0]};border-color:${h[1]}" onclick="${HNEED[i]&&!S.items.includes(HNEED[i])?'lockedHat('+i+')':'S.hat='+i+';save();choose('+first+')'}">${HNEED[i]&&!S.items.includes(HNEED[i])?'🔒':'&nbsp;'}</button>`).join('')}</div>
<input id="nm" maxlength="12" placeholder="Name (optional)" value="${S.name}">
<h2>Learning level</h2>
${LV.map((l,i)=>`<button class="btn alt ${i==S.lvl?'sel':''}" onclick="S.lvl=${i};S.name=$('#nm').value;save();choose(${first})">${l[0]}<br>Ages ${l[1]}</button>`).join('')}
<button class="btn" onclick="S.name=$('#nm').value;save();TAP();${first?'intro()':'menu()'}">${first?'START ADVENTURE':'DONE'}</button>`);
holder('pv',art(WIZ,{H:HATS[S.hat][0],R:HATS[S.hat][1]},10,'float'))}

function say(who,lines,done){let i=0;(function show(){html(`<div id="sp"></div><div class="box" style="min-height:120px"><h2>${who}</h2><p>${lines[i]}</p></div>
<button class="btn" onclick="TAP();${'x'}()">TAP TO CONTINUE ▶</button>`);window.x=()=>{i++;i<lines.length?show():done()};narr(lines[i],who);
holder('sp',who=='King Aurelius'?art(KING,{},10,'float'):who=='Mira'?art(MIRA,{},10,'float'):who=='Flame'?art(FLAME,FO,8,'float'):who=='Professor Wizzle'?art(PROF,{},10,'float'):art(WIZ,{H:HATS[S.hat][0],R:HATS[S.hat][1]},10,'float'))})()}

function intro(){const n=S.name||'little wizard';say('Professor Wizzle',[`Welcome, ${n}! I am Professor Wizzle.`,'Oh no! The 5 Magic Crystals have vanished. The castle lights are fading!',`Will you help me find them, ${n}?`,'Let us start in the Enchanted Castle. Follow the map!'],()=>{S.seenIntro=true;save();map()})}

const WORLDS=[['Enchanted Castle','🏰',1],['Whispering Forest','🌲',0],["Wizard's Village",'🏘️',0],['Crystal Lake','🌊',0],['Moonlight Mountain','⛰️',0]];
function map(){html(`<h2>Kingdom Map</h2><div>${pic('star',3)} ${S.stars} &nbsp; ${pic('gem',3)} ${nc()}/5</div>${S.pet?`<div>${pic(S.pet,5,'float')}</div>`:''}
${WORLDS.map((w,i)=>`<button class="world ${isOpen(i)?'':'lock'}" style="background:${isOpen(i)?'var(--teal)':'#444'}" onclick="TAP();${isOpen(i)?['castle()','forest()','village()','lake()','mountain()','royal()'][i]:`lumi(${i})`}"><span>${w[1]} ${w[0]}</span><span>${isOpen(i)?(nc1(i)?'💎':'▶'):'🔒'}</span></button>`).join('')}
<button class="btn" onclick="TAP();treasures()">🎁 TREASURES</button><button class="btn" onclick="TAP();myCastle()">MY CASTLE</button><button class="btn alt" onclick="TAP();menu()">◀ HOME</button>`)}
function lumi(i){html(`<div class='big float'>${pic('fairy',10)}</div><div class="box"><h2>Lumi</h2><p>${WORLDS[i][0]} is still asleep! ${i==5?'Find all 5 crystals to open the castle gates.':'Finish the world before it to wake it up.'}</p></div><button class="btn" onclick="map()">OK ▶</button>`)}

const PZ=[['colour','🎨 Colour Match'],['shape','🔷 Shape Match'],['count','🔢 Counting Stars']];
const PZ2=[['missing','🔮 Missing Number'],['pattern','🧩 Pattern Magic'],['add','➕ Magic Maths']];
const ITEMS={colour:['🎩','Star Hat'],shape:['📜','Spell Scroll'],count:['🪄','Magic Wand'],missing:['🔮','Crystal Ball'],pattern:['🦉','Owl Pet'],add:['🐲','Dragon Sticker'],eggs:['🥚','Golden Egg'],nest:['🪺','Cosy Nest'],memory:['🍄','Magic Mushroom'],maze:['🧭','Compass']};
const PZ3=[['eggs','🥚 Count the Eggs'],['nest','🪺 Match the Nests'],['memory','🃏 Memory Match'],['maze','🌲 Forest Maze']];
const FLAME=['..G....G..','..GG..GG..','.GGGGGGGG.','GGWEGGWEGG','GGGGGGGGGG','GGGOOOOGGG','.GGOOOOGG.','.GGOOOOGG.','.GG.GG.GG.','..GG..GG..'];
const FO={G:'#1fa971',O:'#ff9f1c'};
let M,Mm;
Object.assign(PAL,{r:'#e63946',b:'#2f6fed',g:'#1fa971',p:'#7b4dff',o:'#ff9f1c',n:'#8b5a2b',w:'#fff',y:'#ffd23f',k:'#222',c:'#2ec4b6',m:'#ff6b9d'});
const SP={star:['...yy...','...yy...','yyyyyyyy','.yyyyyy.','..yyyy..','.yyyyyy.','.yy..yy.','yy....yy'],gem:['..cccc..','.cwwccc.','cwcccccc','cccccccc','bbbbbbbb','.bbbbbb.','..bbbb..','...bb...'],chest:['........','.nnnnnn.','nnnnnnnn','nyyyyyyn','nnnyynnn','nnnnnnnn','nnnnnnnn','kkkkkkkk'],chestOpen:['y.y.yy.y','.yyyyyy.','nnnnnnnn','n......n','nyyyyyyn','nnnyynnn','nnnnnnnn','kkkkkkkk'],hat:['....y...','...pp...','..pppp..','..pppp..','.pppppp.','pppppppp','yyyyyyyy','........'],scroll:['.wwwwww.','nwwwwwwn','nwkkkwwn','nwwwwwwn','nwkkkkwn','nwwwwwwn','.wwwwww.','........'],wand:['......y.','....yyy.','...yyy..','..nn....','.nn.....','nn......','........','........'],ball:['..bbbb..','.bwwbbb.','bwbbbbbb','bbbbbbbb','bbbbbbbb','.bbbbbb.','..nnnn..','.nnnnnn.'],owl:['n..nn..n','nnnnnnnn','nwkwwkwn','nwwwwwwn','nnnoonnn','nnnnnnnn','.nnnnnn.','.o....o.'],egg:['..yyyy..','.yyyyyy.','yywyyyyy','yywyyyyy','yyyyyyyy','yyyyyyyy','.yyyyyy.','..yyyy..'],nest:['..wwww..','.wwwwww.','nnnnnnnn','nnnnnnnn','nnnnnnnn','.nnnnnn.','..nnnn..','........'],mush:['..rrrr..','.rrwwrr.','rrrrrrrr','rwwrrwwr','..wwww..','..wwww..','..wwww..','........'],compass:['..kkkk..','.kwwwwk.','kwwrwwwk','kwwrwwwk','kwwbwwwk','kwwbwwwk','.kwwwwk.','..kkkk..'],potion:['..kkkk..','...ww...','...ww...','..wppw..','.wppppw.','wppppppw','wppppppw','.wwwwww.'],lantern:['...kk...','..kkkk..','.kyyyyk.','kyywwyyk','kyyyyyyk','kyyyyyyk','.kkkkkk.','..kkkk..'],key:['..yyyy..','.yy..yy.','.yy..yy.','..yyyy..','...yy...','...yyy..','...yy...','...yyy..'],book:['bbbbbbbb','bwwwwwwb','bwkkkkwb','bwwwwwwb','bwkkkkwb','bwwwwwwb','bbbbbbbb','bbbbbbbb'],back:['pbpbpbpb','bpbpbpbp','pbpbpbpb','bpbpbpbp','pbpbpbpb','bpbpbpbp','pbpbpbpb','bpbpbpbp']};
Object.assign(SP,{isle:['.gggggg.','gggggggg','nnnnnnnn','.nnnnnn.','..nnnn..','...nn...','........','........'],moon:['..yyy...','.yy.....','yy......','yy......','yy......','yy......','.yy.....','..yyy...'],staff:['.....yy.','....yyyy','.....yy.','....nn..','...nn...','..nn....','.nn.....','nn......'],bell:['...yy...','..yyyy..','.yyyyyy.','.yyyyyy.','yyyyyyyy','yyyyyyyy','........','...yy...'],cloak:['..pppp..','.pppppp.','pppyyppp','pppppppp','pppppppp','ppp..ppp','pp....pp','pp....pp'],crown:['y..yy..y','yy.yy.yy','yyyyyyyy','yyryybyy','yyyyyyyy','yyyyyyyy','........','........'],castle:CASTLE,wiz:WIZ,tree:['...gg...','..gggg..','.gggggg.','gggggggg','..gggg..','.gggggg.','...nn...','...nn...'],house:['...rr...','..rrrr..','.rrrrrr.','rrrrrrrr','.wwwwww.','.wbwwkw.','.wwwwkw.','.wwwwkw.'],wave:['........','..cc....','.cccc.cc','cccccccc','bbbbbbbb','cbbcbbcb','bbbbbbbb','bbbbbbbb'],mount:['...ww...','..wwww..','.pppppp.','.pppppp.','pppppppp','pppppppp','pppppppp','pppppppp'],lock:['..kkkk..','.k....k.','.k....k.','yyyyyyyy','yyykkyyy','yyykkyyy','yyyyyyyy','yyyyyyyy'],check:['........','......gg','.....ggg','g...ggg.','gg.ggg..','.ggggg..','..ggg...','...g....'],fairy:['m.m..m.m','.mmwwmm.','..wwww..','..wSSw..','...ww...','..cwwc..','.cc..cc.','c......c'],paint:['.nnnnnn.','nrrbbggn','nrrbbggn','nyyppmmn','.nnnnnn.','...nn...','...nn...','........'],tri:['...yy...','..yyyy..','..yyyy..','.yyyyyy.','.yyyyyy.','yyyyyyyy','yyyyyyyy','........'],num:['bbbbbbbb','bwwbwwwb','bbwbbwbb','bbwbbwbb','bbwbwwwb','bbbbbbbb','........','........'],puz:['..pp....','.pppp...','pppppppp','pppppppp','ppp.pppp','ppp.pppp','.pppppp.','........'],plus:['...gg...','...gg...','...gg...','gggggggg','gggggggg','...gg...','...gg...','...gg...'],fish:['........','...bbb..','..bbbbb.','bbbbwkbb','bbbbbbbb','..bbbbb.','...bbb..','........'],crab:['r......r','rr....rr','.rrrrrr.','rrwkrwkr','rrrrrrrr','.rrrrrr.','.r.rr.r.','r..rr..r'],shell:['..pppp..','.pmpmpp.','pmpmpmpp','pmpmpmpp','pmpmpmpp','.ppmppp.','..pppp..','...yy...'],octo:['..mmmm..','.mmmmmm.','mmwkmwkm','mmmmmmmm','mmmmmmmm','.m.mm.m.','.m.mm.m.','m..mm..m'],sfish:['...oo...','...oo...','oooooooo','.oooooo.','..oooo..','.oo..oo.','.o....o.','o......o'],turtle:['..gggg..','.gggggg.','gyggygyg','gggggggg','gyggygyg','.gggggg.','g.g..g.g','........']});
const EM={'🏰':'castle','🌲':'tree','🏘':'house','🌊':'wave','⛰':'mount','🔒':'lock','💎':'gem','✅':'check','🧚':'fairy','🐲':'dragon','🧙':'wiz','🥚':'egg','🎨':'paint','🔷':'tri','🔢':'num','🔮':'ball','🧩':'puz','➕':'plus','🪺':'nest','🃏':'back','⭐':'star','🎁':'chest','🦉':'owl'};
const EMR=new RegExp('('+Object.keys(EM).join('|')+')\uFE0F?','g');
function sil(k,sc){const rows=k=='dragon'?FLAME:SP[k],o={};rows.join('').split('').forEach(ch=>{if(ch!='.')o[ch]='#0b0620'});return `<img src='${sprHTML(rows,o,sc).toDataURL()}' style='image-rendering:pixelated'>`}
function pic(k,sc,cls){const d=k=='dragon',c=sprHTML(d?FLAME:SP[k],d?FO:{},sc);return `<img src='${c.toDataURL()}' style='image-rendering:pixelated' ${cls?`class='${cls}'`:''}>`}
const IK={colour:'hat',shape:'scroll',count:'wand',missing:'ball',pattern:'owl',add:'dragon',eggs:'egg',nest:'nest',memory:'mush',maze:'compass',vpat:'potion',sort:'lantern',vseq:'key',riddle:'book'};
function isOpen(i){return i==0||(i==1&&S.crystal)||(i==2&&S.fc)||(i==3&&S.vc)||(i==4&&S.lc)||(i==5&&S.crystal&&S.fc&&S.vc&&S.lc&&S.mc)}
function nc1(i){return i==0?S.crystal:i==1?S.fc:i==2?S.vc:i==3?S.lc:i==4?S.mc:i==5?S.rc:false}
function nc(){return (S.crystal?1:0)+(S.fc?1:0)+(S.vc?1:0)+(S.lc?1:0)+(S.mc?1:0)}
function opts(ans,lo,hi,k){const s=new Set([ans]);while(s.size<k)s.add(Math.max(lo,Math.min(hi,ans+rnd(-3,3))));return shuffle([...s].map(v=>({h:String(v),ok:v==ans})))}
const GEN2={

function drawJig(){html(`<h2>Build the picture!</h2><img src='${J.ref}' style='image-rendering:pixelated;width:64px'><div style='display:grid;grid-template-columns:repeat(${J.cols},1fr);gap:3px;width:100%;max-width:300px'>${J.o.map((t,i)=>`<img src='${J.T[t]}' onclick='jigTap(${i})' style='image-rendering:pixelated;width:100%;border:3px solid ${i==J.sel?'#ffd23f':'#fff'};background:#000;cursor:pointer'>`).join('')}</div><button class='btn alt sm' onclick='castle()'>◀ BACK</button>`)}
function jigTap(i){if(J.sel<0){J.sel=i;TAP();drawJig();return}if(J.sel==i){J.sel=-1;drawJig();return}[J.o[J.sel],J.o[i]]=[J.o[i],J.o[J.sel]];J.sel=-1;TAP();drawJig();if(J.o.every((v,k)=>v==k)){GOOD();setTimeout(finish,700)}}
function hunt(){const n=[3,4,5][S.lvl],keys=shuffle(['gem','star','egg','owl','hat','wand','scroll','ball','key','potion','bell','moon']),T=keys.slice(0,n),D=keys.slice(n,n+6+S.lvl*2),pos=[],place=()=>{for(let g=0;g<200;g++){const x=rnd(6,138),y=rnd(14,70);if(pos.every(p=>Math.abs(p[0]-x)>18||Math.abs(p[1]-y)>18)){pos.push([x,y]);return[x,y]}}const p=[rnd(6,138),rnd(14,70)];pos.push(p);return p};narr('Find the hidden treasures!','narr');H={obj:T.map(k=>{const[x,y]=place();return{k,x,y,f:false}}),dec:D.map(k=>{const[x,y]=place();return{k,x,y}}),tr:Array.from({length:10},()=>[rnd(0,144),rnd(8,66)]),miss:0,hint:false};P={id:'hunt'};drawHunt()}
function hl(){const e=$('#hl');if(e)e.innerHTML=H.obj.map(o=>`<span style='opacity:${o.f?.35:1}'>${pic(o.k,4)}${o.f?pic('check',3):''}</span>`).join('')}
function paintHunt(x){x.fillStyle='#7fd6f0';x.fillRect(0,0,160,90);x.fillStyle='#1f6b3a';x.fillRect(0,30,160,60);x.fillStyle='#2a8a4a';for(let i=0;i<6;i++)x.fillRect(i*30,34+i%3*16,22,6);H.tr.forEach(t=>dspr(x,SP.tree,{},t[0],t[1]-6,2));H.dec.forEach(d=>dspr(x,SP[d.k],{},d.x,d.y,2));H.obj.forEach(o=>{dspr(x,SP[o.k],{},o.x,o.y,2);if(o.f){x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(o.x-1,o.y-1,18,18)}});if(H.hint){const o=H.obj.find(o=>!o.f);if(o){x.strokeStyle='#ffd23f';x.lineWidth=2;x.beginPath();x.arc(o.x+8,o.y+8,14,0,6.3);x.stroke()}}}
function drawHunt(){html(`<h2>Find the hidden treasures!</h2><div class='row' id='hl'></div><canvas id='hc' width='160' height='90' style='width:100%;max-width:420px;border:4px solid var(--edge);touch-action:manipulation'></canvas><button class='btn alt sm' onclick='castle()'>◀ BACK</button>`);const c=$('#hc'),x=c.getContext('2d');paintHunt(x);hl();c.onpointerdown=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*160/r.width,py=(e.clientY-r.top)*90/r.height,o=H.obj.find(o=>!o.f&&px>=o.x-2&&px<=o.x+18&&py>=o.y-2&&py<=o.y+18);if(o){o.f=true;H.miss=0;H.hint=false;GOOD();paintHunt(x);hl();if(H.obj.every(o=>o.f))setTimeout(finish,700)}else{BAD();if(++H.miss>=3){H.hint=true;paintHunt(x)}}}}
const STORY={s:{t:'Lumi found a glowing path in the Whispering Forest. Which way will you go?',c:[['Follow the river','r'],['Climb the hill','h']]},r:{t:'By the river you meet a shy turtle. Her shell has lost its shine!',c:[['Polish her shell','r1'],['Sing her a song','r2']]},h:{t:'On the hill you find a sleepy owl. A cloud is hiding the moon!',c:[['Wave a wand','h1'],['Ask friends to blow','h2']]},r1:{t:'The shell sparkles! The turtle gives you a shiny pearl.',e:1,p:'shell'},r2:{t:'The turtle smiles and hums along. She shows you a golden coin!',e:1,p:'coin'},h1:{t:'Zap! The cloud floats away. The owl gives you a silver feather.',e:1,p:'quill'},h2:{t:'Whoosh! The wind clears the sky. The owl shares a glowing star.',e:1,p:'star'}};
function story(){P={id:'story'};node('s')}
function node(k){const n=STORY[k];narr(n.t,'Lumi');html(`<div class='big float'>${pic('fairy',8)}</div><div class='box' style='min-height:110px'><h2>Lumi</h2><p>${n.t}</p></div>${n.e?`<div class='big'>${pic(n.p,8,'float')}</div><button class='btn' onclick='GOOD();finish()'>CONTINUE ▶</button>`:n.c.map(c=>`<button class='btn' onclick='TAP();node("${c[1]}")'>${c[0]}</button>`).join('')}`)}
function narr(t,who,q){if(!t||S.nar===false||S.mute||S.nv==0||!window.speechSynthesis)return;try{const ss=speechSynthesis,txt=String(t).replace(/<[^>]*>/g,'').replace(/[^\x20-\x7E]/g,'').trim();if(!txt)return;if(!q)ss.cancel();ss.resume();const p=VP[who]||VP.narr,parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];setTimeout(()=>{parts.forEach(s=>{const u=new SpeechSynthesisUtterance(s.trim());u.pitch=p[0];u.rate=p[1];u.volume=S.nv/100;if(VO.length){u.voice=VO[p[2]%VO.length];u.lang=u.voice.lang}ss.speak(u)})},q?0:80)}catch(e){}}
function settings(){html(`<h2>Settings</h2><button class="btn" onclick="S.mute=!S.mute;save();settings()">SOUND: ${S.mute?'OFF':'ON'}</button><button class="btn" onclick="S.nar=!S.nar;save();settings()">NARRATION: ${S.nar?'ON':'OFF'}</button><button class="btn alt" onclick="opening()">REPLAY INTRO</button>
<div class="box" style="font-size:10px;text-align:left">MUSIC<input type="range" min="0" max="100" value="${S.mv}" oninput="setVol('mv',this.value)" style="width:100%;padding:0;border:0;background:none">EFFECTS<input type="range" min="0" max="100" value="${S.sv}" oninput="setVol('sv',this.value)" style="width:100%;padding:0;border:0;background:none">NARRATOR<input type="range" min="0" max="100" value="${S.nv}" oninput="setVol('nv',this.value)" style="width:100%;padding:0;border:0;background:none"></div><button class="btn alt" onclick="testVoice()">TEST VOICE</button><div class="box" style="font-size:9px">Music is made inside the game. Voices come from your device, so they sound different on each phone.</div><button class="btn alt" onclick="menu()">◀ BACK</button>`)}
function parent(){const a=rnd(6,9),b=rnd(6,9);html(`<h2>Parent Area</h2><div class="box">Grown-ups only: what is ${a} + ${b}?</div><input id="ans" inputmode="numeric" placeholder="Answer">
<button class="btn" onclick="+$('#ans').value==${a+b}?pdash():parent()">ENTER</button><button class="btn alt" onclick="menu()">◀ BACK</button>`)}

<div class="row">${LV.map((l,i)=>`<button class="btn sm ${i==S.lvl?'sel':''}" onclick="S.lvl=${i};save();pdash()">${l[0]}</button>`).join('')}</div>

<button class="btn" style="background:#b02a37" onclick="if(confirm('Reset all progress?')){S=def();save();menu()}">RESET PROGRESS</button><button class="btn alt" onclick="menu()">◀ HOME</button>`)}
